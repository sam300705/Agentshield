services:
  postgres:
    image: postgres:16-alpine
    container_name: agentshield-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentshield_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentshield}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentshield} -d ${POSTGRES_DB:-agentshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - agentshield-postgres-data:/var/lib/postgresql/data

volumes:
  agentshield-postgres-data:
