name: AgentShield CI

on:
  pull_request:
  push:
    branches: [main, "phase1/**", "phase2/**", "phase3/**", "phase4/**"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: agentshield-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield_test_password
          POSTGRES_DB: agentshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agentshield:agentshield_test_password@localhost:5432/agentshield?schema=public
      DATABASE_URL_UNPOOLED: postgresql://agentshield:agentshield_test_password@localhost:5432/agentshield?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify local Compose workflow
        env:
          POSTGRES_PORT: 5433
        run: |
          docker compose config --quiet
          pnpm db:up
          pnpm db:down
      - run: pnpm audit --prod
      - run: pnpm db:generate
      - run: pnpm exec prisma validate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:docs
      - run: pnpm build
      - name: Build production dashboard with public OIDC configuration
        env:
          VITE_APP_MODE: live
          VITE_API_BASE_URL: https://api.example.com
          VITE_OIDC_ISSUER: https://identity.example.com
          VITE_OIDC_CLIENT_ID: ci-public-spa
          VITE_OIDC_REDIRECT_URI: https://web.example.com/callback
          VITE_OIDC_AUTHORIZATION_ENDPOINT: https://identity.example.com/authorize
          VITE_OIDC_TOKEN_ENDPOINT: https://identity.example.com/token
          VITE_OIDC_JWKS_URI: https://identity.example.com/keys
        run: pnpm --filter @agentshield/web-dashboard build
      - name: Verify local API dashboard and worker startup
        run: |
          cp .env.example .env
          setsid pnpm dev > dev-startup.log 2>&1 &
          startup_pid=$!
          trap 'kill -- -"$startup_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/health/ready >/dev/null && \
               curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl --fail --silent --header "x-agentshield-demo-user: maya" http://127.0.0.1:3001/api/v1/demo/control-plane >/dev/null
          WORKER_MODE=once pnpm --filter @agentshield/api worker
      - run: pnpm test:integration
      - run: pnpm test:backend-security
      - run: pnpm test:gateway
      - run: pnpm test:github-lifecycle
      - run: pnpm test:github-e2e
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm test:e2e
      - name: Scan deterministic fixture
        id: scan
        run: |
          set +e
          node packages/scanner/dist/cli.js --path examples/vulnerable-repo --format sarif > agentshield-fixture.sarif
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          test "$exit_code" -eq 3
          node --import tsx scripts/validate-sarif.ts agentshield-fixture.sarif
      - name: Gate repository source
        # Exclude only synthetic examples and intentionally illustrative remediation/controller content.
        run: |
          node packages/scanner/dist/cli.js --path . --format sarif \
            --ignore examples \
            --ignore apps/api/src/controllers/controlPlaneController.ts \
            --ignore packages/remediation/src/templates.ts \
            > agentshield-source.sarif
          node --import tsx scripts/validate-sarif.ts agentshield-source.sarif
      - name: Job summary
        run: |
          echo "## AgentShield security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Deterministic scanner exit code: ${{ steps.scan.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No raw evidence is written to this summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agentshield-sarif
          path: agentshield-fixture.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('agentshield-source.sarif') != ''
        with:
          sarif_file: agentshield-source.sarif

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and run production API and worker images
        run: bash scripts/verify-production-container.sh
      - name: Record complete production image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 verified release
        with:
          version: v0.75.0
          image-ref: agentshield:ops
          scanners: vuln
          format: json
          output: agentshield-image-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
      - name: Summarize image review
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('agentshield-image-report.json', 'utf8'));
          const counts = {};
          for (const result of report.Results ?? []) for (const vulnerability of result.Vulnerabilities ?? []) {
            const key = `${vulnerability.Severity}:${vulnerability.FixedVersion ? 'fixable' : 'unfixed'}`;
            counts[key] = (counts[key] ?? 0) + 1;
          }
          console.log(JSON.stringify({ imageReview: counts }));
          NODE
      - name: Preserve image review artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-image-review
          path: agentshield-image-report.json
          retention-days: 14
      - name: Scan production image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 verified release
        with:
          version: v0.75.0
          image-ref: agentshield:ops
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
