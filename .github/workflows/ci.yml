name: AgentShield CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agentshield-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield_test_password
          POSTGRES_DB: agentshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agentshield:agentshield_test_password@localhost:5432/agentshield?schema=public
      DATABASE_URL_UNPOOLED: postgresql://agentshield:agentshield_test_password@localhost:5432/agentshield?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma validate
      - run: pnpm db:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:docs
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm test:gateway
      - name: Build production API image
        run: docker build --pull --tag agentshield-api:ci .
      - name: Verify production API image
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' agentshield-api:ci)" = "node"
          docker run --rm --entrypoint sh agentshield-api:ci -c 'test ! -d /app/src && test -f /app/dist/index.js && test -f /app/dist/worker.js'
          container_id="$(docker run -d --network host \
            -e NODE_ENV=development \
            -e PORT=3101 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e CORS_ORIGIN=http://localhost:5173 \
            -e AUTH_MODE=oidc \
            -e DEMO_AUTH_ENABLED=true \
            -e RATE_LIMIT_ENABLED=false \
            agentshield-api:ci)"
          trap 'docker logs "$container_id" || true; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3101/health/live >/tmp/agentshield-live.json \
              && curl --fail --silent --show-error http://127.0.0.1:3101/health/ready >/tmp/agentshield-ready.json; then
              grep -q '"status":"alive"' /tmp/agentshield-live.json
              grep -q '"status":"ready"' /tmp/agentshield-ready.json
              grep -q '"database":"ok"' /tmp/agentshield-ready.json
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -q true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "AgentShield API container did not become ready" >&2
            docker logs "$container_id"
            exit 1
          fi

          worker_output="$(timeout 45s docker run --rm --network host \
            -e NODE_ENV=development \
            -e DATABASE_URL="$DATABASE_URL" \
            -e CORS_ORIGIN=http://localhost:5173 \
            -e AUTH_MODE=oidc \
            -e DEMO_AUTH_ENABLED=true \
            -e RATE_LIMIT_ENABLED=false \
            -e WORKER_MODE=once \
            --entrypoint node \
            agentshield-api:ci dist/worker.js 2>&1)"
          printf '%s\n' "$worker_output"
          grep -q '"message":"worker started"' <<<"$worker_output"
          grep -q '"message":"worker batch complete"' <<<"$worker_output"
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Generate container SBOM
        run: |
          trivy image --quiet --format cyclonedx --output agentshield-api.sbom.cdx.json agentshield-api:ci
          test -s agentshield-api.sbom.cdx.json
          grep -q '"bomFormat"' agentshield-api.sbom.cdx.json
          grep -q 'CycloneDX' agentshield-api.sbom.cdx.json
      - name: Gate HIGH and CRITICAL container vulnerabilities
        run: |
          trivy image --timeout 10m --scanners vuln --pkg-types os,library \
            --severity HIGH,CRITICAL --exit-code 1 --format table agentshield-api:ci
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm test:e2e
      - name: Scan deterministic fixture
        id: scan
        run: |
          set +e
          node packages/scanner/dist/cli.js --path examples/vulnerable-repo --format sarif > agentshield-fixture.sarif
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          test "$exit_code" -eq 3
          node --import tsx scripts/validate-sarif.ts agentshield-fixture.sarif
      - name: Gate repository source
        # Exclude only synthetic examples and intentionally illustrative remediation/controller content.
        run: |
          node packages/scanner/dist/cli.js --path . --format sarif \
            --ignore examples \
            --ignore apps/api/src/controllers/controlPlaneController.ts \
            --ignore packages/remediation/src/templates.ts \
            > agentshield-source.sarif
          node --import tsx scripts/validate-sarif.ts agentshield-source.sarif
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Audit production dependencies
        run: pnpm --prod audit --audit-level high
      - name: Job summary
        run: |
          echo "## AgentShield security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Deterministic scanner exit code: ${{ steps.scan.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production API image: built, non-root, smoke-tested." >> "$GITHUB_STEP_SUMMARY"
          echo "No raw evidence is written to this summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agentshield-security-artifacts
          path: |
            agentshield-fixture.sarif
            agentshield-source.sarif
            agentshield-api.sbom.cdx.json
          if-no-files-found: ignore

  sarif-upload:
    name: Upload SARIF
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agentshield-security-artifacts
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: agentshield-source.sarif
