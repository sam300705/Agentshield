services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: sh -c "pnpm db:deploy && node apps/api/dist/index.js"
    env_file:
      - ./azure.env
    environment:
      PORT: 3001
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: node apps/api/dist/worker.js
    env_file:
      - ./azure.env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    env_file:
      - ./azure.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
